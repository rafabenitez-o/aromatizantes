<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2eb">
<title>Aromatizantes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Aromatizantes</h1>

  <h2>1. Producto</h2>
  <div class="seg" id="prod"></div>
  <div class="formula" id="formula"></div>

  <h2>2. Qué vas a preparar</h2>
  <div class="seg" id="mode">
    <button data-m="blend" class="on">Blend</button>
    <button data-m="single">Aroma individual</button>
  </div>
  <select id="item" aria-label="Blend o aroma"></select>
  <div class="sub" id="iteminfo"></div>

  <h2>3. Cantidades (gramos)</h2>
  <div class="card" id="list"></div>
  <button class="big" id="copyall">Copiar todo</button>
  <div class="msg" id="msg"></div>

  <div class="sub foot" id="envase"></div>
</main>
<script src="app.js"></script>
</body>
</html>
